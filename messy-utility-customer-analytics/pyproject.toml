[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "messy-utility-customer-analytics"
version = "0.1.0"
description = "On-premises utility customer and consumption analytics"
requires-python = ">=3.12"
readme = "README.md"
dependencies = []

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
